<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkobot | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --tx-base: #0B1120;
            --tx-panel: rgba(15, 23, 42, 0.7);
            --tx-border: rgba(56, 189, 248, 0.2);
            --glow-1: rgba(6, 182, 212, 0.15);
            --glow-2: rgba(99, 102, 241, 0.15);
        }

        body {
            background-color: var(--tx-base);
            font-family: 'Outfit', sans-serif;
            background-image:
                radial-gradient(circle at 10% 40%, var(--glow-1), transparent 30%),
                radial-gradient(circle at 90% 20%, var(--glow-2), transparent 35%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: var(--tx-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--tx-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.5);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #06B6D4 0%, #6366F1 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>

<body>
    <div class="glass-card">
        <div class="text-center mb-8">
            <div class="inline-block p-3 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-cyan-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">DARKO<span class="text-cyan-400">BOT</span></h1>
            <p class="text-gray-400 text-sm mt-2">Mission Control Authorization</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Usuario</label>
                <input type="text" name="username" required
                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none input-glow transition-all"
                    placeholder="dark90">
            </div>
            <div>
                <label
                    class="block text-gray-400 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none input-glow transition-all"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full btn-gradient text-white font-bold py-4 rounded-xl shadow-lg uppercase tracking-wider text-sm">
                Desbloquear Acceso
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-[0.65rem] text-gray-500 uppercase tracking-widest font-mono">
                &copy; 2026 BOTALGO INC. | ENCRYPTED LINK
            </p>
        </div>
    </div>
</body>

</html>
